<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Diri</title>
    <link rel="stylesheet" href="profil.css">
</head>
<body>
    <!-- ID Selector target -->
    <div id="main-profile">
        <!-- Element selector target -->
        <h1>Rivaldo Widiarto</h1>

        <!-- Descendant selector target (p inside #main-profile) -->
        <p class="description">Seorang pengembang web pemula yang bersemangat dalam mempelajari HTML, CSS, dan JavaScript.
             Suka mengeksplorasi desain antarmuka yang bersih dan responsif.</p>

        <h2>Keahlian</h2>
        <div class="skills-container">
            <!-- Class selector target & inline-block -->
            <span class="skill-label">HTML</span>
            <span class="skill-label">CSS</span>
            <span class="skill-label">JavaScript</span>
        </div>

        <!-- Class selector target & inline-block -->
        <a href="#" class="btn-kontak">Hubungi Saya</a>
    </div>
</body>
</html>
